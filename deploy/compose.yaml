name: eats

services:
  postgres:
    image: postgres:18
    container_name: eats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eats
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Password required}"
      POSTGRES_DB: eats_ingestion
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
      - "${LAN_IP:?Set LAN interface address}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    image: "eats-ingestion:${INGESTION_IMAGE_TAG:-0.1.21}"
    container_name: eats-ingestion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eats_ingestion;Username=eats;Password=${POSTGRES_PASSWORD:?Password required};GSS Encryption Mode=Disable"
      Ingestion__ScheduleTime: "05:00:00"
      Ingestion__ScheduleTimeZone: "${INGESTION_TIME_ZONE:-America/New_York}"
      Serilog__MinimumLevel__Default: "Information"
      Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime: "Information"
      Serilog__Console__IncludeExceptionDetails: "false"
      FeatureManagement__JobDetailHydrator: "true"
      FeatureManagement__JobSynchronizer: "true"
      WORKDAY_SOURCES: "/app/config/workdaySources.json"
      # Optional OTLP export: configure once a receiver is deployed
      # Telemetry__OtlpEndpoint: "http://otel-collector:4318"
    volumes:
      - "${WORKDAY_SOURCES_HOST_PATH:?Set absolute path to workdaySources.json}:/app/config/workdaySources.json:ro"
    ports:
      - "127.0.0.1:${INGESTION_HOST_PORT:-8080}:8080"
      - "${LAN_IP:?Set LAN interface address}:${INGESTION_HOST_PORT:-8080}:8080"
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
