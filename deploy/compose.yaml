name: eats

services:
  postgres:
    image: postgres:18
    container_name: eats-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: eats
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Password required}"
      POSTGRES_DB: eats_ingestion

    ports:
      - "192.168.1.128:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    image: eats-ingestion:0.1.21
    container_name: eats-ingestion
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Runtime
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"

      # Database
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eats_ingestion;Username=eats;Password=${POSTGRES_PASSWORD:?Password required};GSS Encryption Mode=Disable"

      # Daily synchronization
      Ingestion__ScheduleTime: "05:00:00"
      Ingestion__ScheduleTimeZone: "America/New_York"

      # Structured logging
      Serilog__MinimumLevel__Default: "Information"
      Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime: "Information"
      Serilog__Console__IncludeExceptionDetails: "false"

      # Feature flags
      FeatureManagement__JobDetailHydrator: "true"
      FeatureManagement__JobSynchronizer: "true"

      # Workday sources
      WORKDAY_SOURCES: "/app/config/workdaySources.json"

      # Optional OTLP export
      # Telemetry__OtlpEndpoint: "http://otel-collector:4318"

    volumes:
      - /opt/eats/config/workdaySources.json:/app/config/workdaySources.json:ro

    ports:
      - "192.168.1.128:8080:8080"
      - "127.0.0.1:8080:8080"

    stop_grace_period: 60s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
