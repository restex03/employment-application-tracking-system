name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore apps/ingestion/Eats.Ingestion.slnx

      - name: Build .NET solution
        run: dotnet build apps/ingestion/Eats.Ingestion.slnx --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test apps/ingestion/Eats.Ingestion.slnx --configuration Release --no-build --no-restore

  nestjs:
    name: NestJS typecheck and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Vitest tests
        env:
          RUN_LLM_REGRESSION: '0'
        run: npm run test:run

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n deployScripts/build-ingestion.sh deployScripts/deploy-ingestion.sh deployScripts/deploy-from-ci.sh

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          LAN_IP: 192.0.2.10
          WORKDAY_SOURCES_HOST_PATH: /tmp/ci-workdaySources.json
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config --quiet

  docker-build:
    name: Docker ingestion image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion/Dockerfile
          push: false
          cache-from: type=gha

  publish-ingestion:
    name: Publish ingestion image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [dotnet, nestjs, compose, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eats-ingestion:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eats-ingestion:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ingestion:
    name: Deploy ingestion to fred
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-ingestion]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Connect to private Tailscale network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ping: 100.110.228.120
          tags: tag:github-actions

      - name: Configure SSH authentication
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy published commit to fred
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          : "${DEPLOY_SSH_HOST:?Set DEPLOY_SSH_HOST in the production environment}"
          : "${DEPLOY_SSH_USER:?Set DEPLOY_SSH_USER in the production environment}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" < deployScripts/deploy-from-ci.sh
