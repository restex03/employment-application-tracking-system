name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore apps/ingestion/Eats.Ingestion.slnx

      - name: Build .NET solution
        run: dotnet build apps/ingestion/Eats.Ingestion.slnx --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test apps/ingestion/Eats.Ingestion.slnx --configuration Release --no-build --no-restore

  nestjs:
    name: NestJS typecheck and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Vitest tests
        env:
          RUN_LLM_REGRESSION: '0'
        run: npm run test:run

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n deployScripts/build-ingestion.sh deployScripts/deploy-ingestion.sh

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          LAN_IP: 192.0.2.10
          WORKDAY_SOURCES_HOST_PATH: /tmp/ci-workdaySources.json
        run: docker compose -f deploy/compose.yaml config --quiet
